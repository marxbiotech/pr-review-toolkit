name: Release

on:
  push:
    branches: [main]
    paths:
      - '.claude-plugin/plugin.json'
      - '.codex-plugin/plugin.json'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify version parity
        run: |
          A=$(jq -e -r '.version' .claude-plugin/plugin.json) || {
            echo "::error::Failed to read .version from .claude-plugin/plugin.json"; exit 1; }
          B=$(jq -e -r '.plugins[0].version' .claude-plugin/marketplace.json) || {
            echo "::error::Failed to read .plugins[0].version from .claude-plugin/marketplace.json"; exit 1; }
          C=$(jq -e -r '.version' .codex-plugin/plugin.json) || {
            echo "::error::Failed to read .version from .codex-plugin/plugin.json"; exit 1; }
          if [ "$A" != "$B" ] || [ "$A" != "$C" ]; then
            echo "::error::Refusing to tag: version drift across manifests"
            echo "  .claude-plugin/plugin.json:        $A"
            echo "  .claude-plugin/marketplace.json:   $B"
            echo "  .codex-plugin/plugin.json:         $C"
            exit 1
          fi
          echo "✓ All three manifests at $A"

      - name: Verify release artifacts
        run: |
          for f in \
            .claude-plugin/plugin.json \
            .claude-plugin/marketplace.json \
            .codex-plugin/plugin.json \
            .agents/plugins/marketplace.json \
            codex/skills/codex-review-pass/SKILL.md \
            codex/skills/codex-fix-worker/SKILL.md; do
            if [ ! -f "$f" ]; then
              echo "::error::Release blocked: missing artifact $f at HEAD"
              exit 1
            fi
          done
          jq empty \
            .claude-plugin/plugin.json \
            .claude-plugin/marketplace.json \
            .codex-plugin/plugin.json \
            .agents/plugins/marketplace.json
          echo "✓ All release artifacts present and valid JSON"

      - name: Get version from plugin.json
        id: version
        run: |
          VERSION=$(jq -r '.version' .claude-plugin/plugin.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag v${{ steps.version.outputs.version }} already exists, skipping release"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag v${{ steps.version.outputs.version }} does not exist, proceeding with release"
          fi

      - name: Get previous tag
        id: prev_tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          set +e
          DESCRIBE_OUTPUT=$(git describe --tags --abbrev=0 2>&1)
          DESCRIBE_RC=$?
          set -e

          if [ "$DESCRIBE_RC" -eq 0 ]; then
            PREV_TAG="$DESCRIBE_OUTPUT"
          elif echo "$DESCRIBE_OUTPUT" | grep -q "No names found"; then
            PREV_TAG=""
            echo "No previous tags (initial release)"
          else
            echo "::error::git describe failed unexpectedly (exit $DESCRIBE_RC):"
            echo "$DESCRIBE_OUTPUT"
            exit 1
          fi
          echo "tag=$PREV_TAG" >> $GITHUB_OUTPUT
          echo "Previous tag: $PREV_TAG"

      - name: Generate changelog
        id: changelog
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PREV_TAG="${{ steps.prev_tag.outputs.tag }}"

          echo "## What's Changed in v$VERSION" > release_notes.md
          echo "" >> release_notes.md

          if [ -n "$PREV_TAG" ]; then
            echo "Changes since $PREV_TAG:" >> release_notes.md
            echo "" >> release_notes.md
            git log --pretty=format:"- %s" "$PREV_TAG"..HEAD >> release_notes.md
          else
            echo "Initial release" >> release_notes.md
          fi

          echo "" >> release_notes.md
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "" >> release_notes.md
          echo "### Installation" >> release_notes.md
          echo "" >> release_notes.md
          echo "In Claude Code:" >> release_notes.md
          echo '```' >> release_notes.md
          echo "/plugin marketplace add marxbiotech/pr-review-toolkit" >> release_notes.md
          echo "/plugin install pr-review-toolkit" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "For Codex, this release includes a source plugin manifest at \`.codex-plugin/plugin.json\` with skills under \`codex/skills/\`." >> release_notes.md

          cat release_notes.md

      - name: Create tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: false
